<form #form="ngForm" (submit)="onSubmit(form)" [class.submitted]="service.formSubmitted" novalidate autocomplete="off">
    <input type="hidden" name="paymentDetailId" [value]="service.formData.paymentDetailId">
    
    
    <div class="mb-3">
      <label>Card Owner Name</label>
    
      <input
        class="form-control form-control-lg"
        placeholder="Name on Card"
        #cardOwnerName="ngModel"
        name="cardOwnerName"
        [(ngModel)]="service.formData.cardOwnerName"
        required
        pattern="^[a-zA-Z\s]+$"
      >
    
      <div class="text-danger" *ngIf="cardOwnerName.errors && (cardOwnerName.touched || service.formSubmitted)">
    
        <div *ngIf="cardOwnerName.errors['required']">
          Name on card is required.
        </div>
    
        <div *ngIf="cardOwnerName.errors['pattern']">
          Name can contain only letters and spaces.
        </div>
    
      </div>
    </div>



    <div class="mb-3">
      <label>Card Number</label>
    
      <input
        class="form-control"
        name="cardNumber"
        #cardNumber="ngModel"
        [(ngModel)]="service.formData.cardNumber"
        required
        pattern="^[0-9]{16}$"
        maxlength="16"
      />

      <div class="text-danger" *ngIf="cardNumber.errors && (cardNumber.touched || service.formSubmitted)">

        <div *ngIf="cardNumber.errors['required']">
          Card number is required.
        </div>

        <div *ngIf="cardNumber.errors['pattern']">
          Card number must contain exactly 16 digits.
        </div>

      </div>
    </div>
  
    <div class="mb-3 col-6">
      <label>Security Code</label>
    
      <input
        class="form-control form-control-lg"
        placeholder="CVV"
        type="password"
        #securityCode="ngModel"
        name="securityCode"
        [(ngModel)]="service.formData.securityCode"
        required
        pattern="^[0-9]{3}$"
        maxlength="3"
      >
    
      <div class="text-danger" *ngIf="securityCode.errors && (securityCode.touched || service.formSubmitted)">
    
        <div *ngIf="securityCode.errors['required']">
          CVV is required.
        </div>
    
        <div *ngIf="securityCode.errors['pattern']">
          CVV must contain exactly 3 digits.
        </div>
    
      </div>
    </div>


    <div class="mb-3 col-6">
      <label>Valid Through</label>
    
      <input
        class="form-control form-control-lg"
        placeholder="MM/YY"
        #expirationDate="ngModel"
        name="expirationDate"
        [(ngModel)]="service.formData.expirationDate"
        required
        pattern="^(0[1-9]|1[0-2])\/[0-9]{2}$"
      >
    
      <div class="text-danger" *ngIf="expirationDate.errors && (expirationDate.touched || service.formSubmitted)">
    
        <div *ngIf="expirationDate.errors['required']">
          Expiration date is required.
        </div>
    
        <div *ngIf="expirationDate.errors['pattern']">
          Valid through must be in MM/YY format (example: 05/27).
        </div>
    
      </div>
    </div>
      
    <div class="d-grid">
      <button class="btn btn-lg btn-success" type="submit">
        Submit
      </button>
    </div>
  
</form>
