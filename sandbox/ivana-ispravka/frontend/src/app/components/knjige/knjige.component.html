<div class="container">
  <div class="content-wrapper">
    <div class="form-section">
      <h2>Dodaj novu knjigu</h2>
      <app-knjiga-form (studentAdded)="onBookAdded()"></app-knjiga-form>
    </div>
    <div class="list-section">
      <h2>Biblioteka ({{books.length}})</h2>
      <app-knjiga-list [students]="books" (deleteStudent)="onDeleteBook($event)"></app-knjiga-list>
    </div>
  </div>
</div>
