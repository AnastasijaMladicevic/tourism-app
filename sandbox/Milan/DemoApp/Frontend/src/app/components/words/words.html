<h1>Words CRUD</h1>

<input [(ngModel)]="newWord" placeholder="Nova reč" />
<button (click)="add()">Dodaj</button>

@for (w of words; track w.id) {
  <div>
    <input [(ngModel)]="w.text" />
    <button (click)="update(w)">Update</button>
    <button (click)="delete(w.id)">Delete</button>
  </div>
}
