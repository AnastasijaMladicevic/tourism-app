<section class="locality-create-page">
  <header class="page-head">
    <div>
      <p class="breadcrumbs">Dashboard <span>></span> Localities <span>></span> Create</p>
      <h1>Create Location</h1>
      <p class="subtle-text">Add a new location for your managed destination.</p>
    </div>
  </header>

  <div class="create-layout">
    <form class="create-form card" (ngSubmit)="onSubmit()">
      <label>
        <span>Name *</span>
        <input type="text" [(ngModel)]="form.name" name="name" required />
      </label>

      <label>
        <span>Description</span>
        <textarea rows="4" [(ngModel)]="form.description" name="description"></textarea>
      </label>

      <div class="row-2">
        <label>
          <span>Destination *</span>
          <select [(ngModel)]="form.destinationId" name="destinationId" required [disabled]="isLoadingOptions">
            <option *ngFor="let option of destinationOptions" [ngValue]="option.id">{{ option.name }}</option>
          </select>
        </label>

        <label>
          <span>Type *</span>
          <select [(ngModel)]="form.localityTypeId" name="localityTypeId" required [disabled]="isLoadingOptions">
            <option *ngFor="let option of localityTypeOptions" [ngValue]="option.id">{{ option.name }}</option>
          </select>
        </label>
      </div>

      <label>
        <span>Main image URL</span>
        <input type="url" [(ngModel)]="form.imageUrl" name="imageUrl" />
      </label>

      <p class="error-message" *ngIf="errorMessage">{{ errorMessage }}</p>

      <div class="actions">
        <button type="button" class="ghost-btn" (click)="onCancel()">Cancel</button>
        <button type="submit" class="primary-btn" [disabled]="isSubmitting || isLoadingOptions">
          {{ isSubmitting ? 'Creating...' : 'Create Location' }}
        </button>
      </div>
    </form>

    <aside class="side-column card">
      <header class="side-header">
        <span class="material-symbols-outlined">my_location</span>
        <h3>Location Intelligence</h3>
      </header>

      <div class="map-shell">
        <app-map
          [lat]="mapLat"
          [lng]="mapLng"
          [zoom]="14"
          [popupText]="form.name || 'New location'"
          [interactive]="false"
          [showMarker]="hasMapCoordinates"
          mapId="manager-create-locality-map"
        ></app-map>
      </div>

      <div class="location-line">
        <span class="material-symbols-outlined">search</span>
        <p>{{ locationSummary }}</p>
      </div>

      <div class="location-inputs">
        <label class="mini-field">
          <span>Latitude</span>
          <input type="number" min="-90" max="90" step="0.000001" [(ngModel)]="form.latitude" name="latitude" />
        </label>
        <label class="mini-field">
          <span>Longitude</span>
          <input type="number" min="-180" max="180" step="0.000001" [(ngModel)]="form.longitude" name="longitude" />
        </label>
      </div>
    </aside>
  </div>
</section>
