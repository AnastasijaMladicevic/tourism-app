<div class="page">

  <div class="card">

    <div class="icon">
        <span class="material-symbols-outlined">
            logout
        </span>
    </div>

    <h2>Confirm Sign Out?</h2>

    <p class="desc">
      Are you sure you want to end your current session and exit the admin panel?
    </p>

    <button class="logout" (click)="confirmSignOut()">
      Sign Out
    </button>

    <button class="cancel" (click)="cancel()">
      ← Keep me signed in
    </button>

    <div class="info">
      <span class="material-symbols-outlined shield">
            gpp_maybe
        </span>
      <div>
        <strong>SESSION SECURITY</strong>
        <p>
          For your protection, sessions are automatically terminated after 30 minutes of inactivity.
        </p>
      </div>
    </div>

  </div>

</div>
