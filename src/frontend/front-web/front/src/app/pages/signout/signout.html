<div class="page">

  <div class="card">

    <div class="icon" aria-hidden="true">
      <span class="material-symbols-outlined">logout</span>
    </div>

    <h2>Confirm Sign Out?</h2>

    <p class="desc">
      Are you sure you want to end your current session and leave the platform?
    </p>

    <div class="actions">
      <button type="button" class="logout" (click)="confirmSignOut()">
        Sign Out
      </button>

      <button type="button" class="cancel" (click)="cancel()">
        <span class="material-symbols-outlined" aria-hidden="true">arrow_back</span>
        Keep me signed in
      </button>
    </div>

    <div class="info">
      <span class="material-symbols-outlined shield" aria-hidden="true">shield</span>
      <div>
        <strong>Session Security</strong>
        <p>
          For your protection, sessions are automatically terminated after 30 minutes of inactivity.
        </p>
      </div>
    </div>

  </div>

</div>
