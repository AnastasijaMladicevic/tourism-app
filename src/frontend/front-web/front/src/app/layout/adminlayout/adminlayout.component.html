<div class="admin-layout">

  <!-- SIDEBAR -->
  <aside class="sidebar">

    <p class="sidebar-section-label">Main Menu</p>

    <a class="nav-item" routerLink="/admin/dashboard" routerLinkActive="active">
      <svg class="nav-icon" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.8">
        <rect x="2" y="2" width="8" height="8" rx="1.5"/>
        <rect x="12" y="2" width="8" height="8" rx="1.5"/>
        <rect x="2" y="12" width="8" height="8" rx="1.5"/>
        <rect x="12" y="12" width="8" height="8" rx="1.5"/>
      </svg>
      Dashboard
    </a>

    <a class="nav-item" routerLink="/admin/destinations" routerLinkActive="active">
      <svg class="nav-icon" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.8">
        <path d="M11 2C8.2 2 6 4.2 6 7c0 4.5 5 11 5 11s5-6.5 5-11c0-2.8-2.2-5-5-5z"/>
        <circle cx="11" cy="7" r="2"/>
      </svg>
      Destinations
    </a>

    <a class="nav-item" routerLink="/admin/users" routerLinkActive="active">
      <svg class="nav-icon" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.8">
        <circle cx="8" cy="7" r="3"/>
        <path d="M2 19c0-3.3 2.7-6 6-6"/>
        <circle cx="17" cy="9" r="2" stroke-width="1.6"/>
        <path d="M13 19c0-2.2 1.8-4 4-4s4 1.8 4 4" stroke-width="1.6"/>
        <path d="M14.5 7.5a2 2 0 012-2" stroke-width="1.6"/>
      </svg>
      Users & Roles
    </a>

    <a class="nav-item" routerLink="/admin/map" routerLinkActive="active">
      <svg class="nav-icon" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.8">
        <polygon points="2,4 8,2 14,4 20,2 20,18 14,20 8,18 2,20"/>
        <line x1="8" y1="2" x2="8" y2="18"/>
        <line x1="14" y1="4" x2="14" y2="20"/>
      </svg>
      Map View
    </a>

    <p class="sidebar-section-label system">System</p>

    <a class="nav-item" routerLink="/admin/activity-log" routerLinkActive="active">
      <svg class="nav-icon" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.8">
        <rect x="5" y="2" width="12" height="18" rx="2"/>
        <path d="M8 2v2h6V2"/>
        <line x1="8" y1="10" x2="14" y2="10"/>
        <line x1="8" y1="14" x2="12" y2="14"/>
      </svg>
      Activity Log
    </a>

  </aside>

  <!-- MAIN -->
  <div class="main">

    <!-- TOPBAR -->
    <header class="topbar">

      <!-- Logo -->
      <div class="topbar-logo">
        <img src="assets/logo.png" alt="SpireGO" class="logo-img" />
      </div>

      <!-- Search -->
      <div class="search-wrapper">
        <svg class="search-icon" width="15" height="15" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.8">
          <circle cx="10" cy="10" r="7"/>
          <path d="M17 17l3 3"/>
        </svg>
        <input
          class="search-input"
          type="text"
          placeholder="Search destinations, objects, users..."
          [(ngModel)]="searchQuery"
        />
      </div>

      <!-- Desna strana -->
      <div class="topbar-right">

        <!-- Bell -->
        <button class="icon-btn" title="Notifications">
          <svg width="18" height="18" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M11 3a7 7 0 017 7c0 4 1.5 5 1.5 5h-17S4 14 4 10a7 7 0 017-7z"/>
            <path d="M9 18a2 2 0 004 0"/>
          </svg>
        </button>

        <!-- Settings -->
        <button class="icon-btn" title="Settings" routerLink="/admin/settings">
          <svg width="18" height="18" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.8">
            <circle cx="11" cy="11" r="3"/>
            <path d="M11 2v2M11 18v2M2 11h2M18 11h2M4.9 4.9l1.4 1.4M15.7 15.7l1.4 1.4M4.9 17.1l1.4-1.4M15.7 6.3l1.4-1.4"/>
          </svg>
        </button>

        <!-- User -->
        <div class="topbar-user">
          <div class="user-meta">
            <span class="user-name">{{ user.name }}</span>
            <span class="user-email">{{ user.email }}</span>
          </div>
          <div class="user-avatar">
            <img *ngIf="user.avatarUrl" [src]="user.avatarUrl" [alt]="user.name" />
            <span *ngIf="!user.avatarUrl">{{ user.initials }}</span>
          </div>
        </div>

      </div>
    </header>

    <!-- PAGE CONTENT -->
    <div class="page-outlet">
      <router-outlet></router-outlet>
    </div>

  </div>
</div>
