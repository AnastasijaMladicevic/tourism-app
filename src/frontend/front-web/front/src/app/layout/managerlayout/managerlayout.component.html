<div class="manager-layout">
  <header class="topbar">
    <div class="topbar-logo">
      <img src="assets/logo.png" alt="SpireGO" class="logo-img" />
    </div>

    <div class="search-wrapper">
      <svg
        class="search-icon"
        width="15"
        height="15"
        viewBox="0 0 22 22"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
      >
        <circle cx="10" cy="10" r="7" />
        <path d="M17 17l3 3" />
      </svg>
      <input
        class="search-input"
        type="text"
        placeholder="Search destinations, objects, users..."
        [(ngModel)]="searchQuery"
      />
    </div>

    <div class="topbar-right">
      <button class="icon-btn bell-btn" title="Notifications">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          height="24px"
          viewBox="0 -960 960 960"
          width="24px"
          fill="currentColor"
        >
          <path
            d="M160-200v-80h80v-280q0-83 50-147.5T420-792v-28q0-25 17.5-42.5T480-880q25 0 42.5 17.5T540-820v28q80 20 130 84.5T720-560v280h80v80H160Zm320-300Zm0 420q-33 0-56.5-23.5T400-160h160q0 33-23.5 56.5T480-80ZM320-280h320v-280q0-66-47-113t-113-47q-66 0-113 47t-47 113v280Z"
          />
        </svg>
      </button>
      <!-- TODO LINK SETTINGS PAGE -->
      <button class="icon-btn settings-btn" title="Settings">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          height="24px"
          viewBox="0 -960 960 960"
          width="24px"
          fill="currentColor"
        >
          <path
            d="m370-80-16-128q-13-5-24.5-12T307-235l-119 50L78-375l103-78q-1-7-1-13.5v-27q0-6.5 1-13.5L78-585l110-190 119 50q11-8 23-15t24-12l16-128h220l16 128q13 5 24.5 12t22.5 15l119-50 110 190-103 78q1 7 1 13.5v27q0 6.5-2 13.5l103 78-110 190-118-50q-11 8-23 15t-24 12L590-80H370Zm70-80h79l14-106q31-8 57.5-23.5T639-327l99 41 39-68-86-65q5-14 7-29.5t2-31.5q0-16-2-31.5t-7-29.5l86-65-39-68-99 42q-22-23-48.5-38.5T533-694l-13-106h-79l-14 106q-31 8-57.5 23.5T321-633l-99-41-39 68 86 64q-5 15-7 30t-2 32q0 16 2 31t7 30l-86 65 39 68 99-42q22 23 48.5 38.5T427-266l13 106Zm42-180q58 0 99-41t41-99q0-58-41-99t-99-41q-59 0-99.5 41T342-480q0 58 40.5 99t99.5 41Zm-2-140Z"
          />
        </svg>
      </button>

      <div class="topbar-user">
        <div class="user-meta">
          <span class="user-name">{{ user.name }}</span>
          <span class="user-email">{{ user.email }}</span>
        </div>
        <div class="user-avatar">
            @if (user.avatarUrl) {
              <img [src]="user.avatarUrl" [alt]="user.name" />
            } @else {
              <span>{{ user.initials }}</span>
            }
        </div>
      </div>
    </div>
  </header>

  <div class="layout-shell">
    <aside class="sidebar">
      <p class="sidebar-section-label">Main Menu</p>

      <a class="nav-item" routerLink="/manager/dashboard" routerLinkActive="active">
        <svg
          class="nav-icon"
          viewBox="0 0 22 22"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
        >
          <rect x="2" y="2" width="8" height="8" rx="1.5" />
          <rect x="12" y="2" width="8" height="8" rx="1.5" />
          <rect x="2" y="12" width="8" height="8" rx="1.5" />
          <rect x="12" y="12" width="8" height="8" rx="1.5" />
        </svg>
        Dashboard
      </a>

      <a class="nav-item" routerLink="/manager/objects" routerLinkActive="active">
        <span class="material-symbols-outlined">
        apartment
        </span>
        Objects
      </a>

      <a class="nav-item" routerLink="/manager/activities" routerLinkActive="active">
        <span class="material-symbols-outlined"> hiking </span>
        Activities
      </a>

      <a class="nav-item" routerLink="/manager/events" routerLinkActive="active">
        <svg
          class="nav-icon"
          viewBox="0 0 22 22"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
        >
          <rect x="3" y="4" width="16" height="15" rx="2" />
          <line x1="3" y1="9" x2="19" y2="9" />
          <line x1="7" y1="2" x2="7" y2="6" />
          <line x1="15" y1="2" x2="15" y2="6" />
        </svg>
        Events
      </a>

      <a class="nav-item" routerLink="/manager/localities" routerLinkActive="active">
        <span class="material-symbols-outlined">
          pin_drop
        </span>
        Localities
      </a>

      <a class="nav-item" routerLink="/manager/map" routerLinkActive="active">
        <svg
          class="nav-icon"
          viewBox="0 0 22 22"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
        >
          <polygon points="2,4 8,2 14,4 20,2 20,18 14,20 8,18 2,20" />
          <line x1="8" y1="2" x2="8" y2="18" />
          <line x1="14" y1="4" x2="14" y2="20" />
        </svg>
        Map View
      </a>

      <a class="sidebar-logout" routerLink="/signout">
        <svg
          class="logout-icon"
          viewBox="0 0 22 22"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
        >
          <path d="M8 3H5a2 2 0 00-2 2v12a2 2 0 002 2h3" />
          <path d="M13 7l4 4-4 4" />
          <line x1="17" y1="11" x2="8" y2="11" />
        </svg>
        Sign Out
      </a>
    </aside>

    <div class="main">
      <div class="page-outlet">
        <router-outlet></router-outlet>
      </div>
    </div>
  </div>
</div>
