<div class="notification-bell">
  <button
    class="icon-btn bell-btn"
    type="button"
    title="Notifications"
    aria-label="Notifications"
    [attr.aria-expanded]="isOpen()"
    (click)="togglePanel()">
    <svg width="18" height="18" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.8">
      <path d="M11 3a7 7 0 017 7c0 4 1.5 5 1.5 5h-17S4 14 4 10a7 7 0 017-7z"/>
      <path d="M9 18a2 2 0 004 0"/>
    </svg>
    <span class="badge" *ngIf="hasUnread()">{{ unreadBadgeLabel() }}</span>
  </button>

  <section class="notification-panel" *ngIf="isOpen()">
    <header class="panel-header">
      <div>
        <h3>Notifications</h3>
        <p>{{ unreadCount() }} unread</p>
      </div>
      <button
        class="panel-action"
        type="button"
        [disabled]="!hasUnread() || isMarkingAll()"
        (click)="markAllAsRead($event)">
        Mark all read
      </button>
    </header>

    <div class="panel-body" *ngIf="!isLoading(); else loadingState">
      <button
        class="notification-row"
        type="button"
        *ngFor="let notification of notifications()"
        [class.notification-row--unread]="!notification.isRead"
        (click)="openNotification(notification)">
        <span class="notification-accent" [attr.data-kind]="notificationKind(notification)"></span>
        <div class="notification-copy">
          <div class="notification-meta">
            <strong>{{ notification.title }}</strong>
            <span>{{ formatRelativeTime(notification.createdAt) }}</span>
          </div>
          <p>{{ notification.message }}</p>
        </div>
      </button>

      <div class="empty-state" *ngIf="!notifications().length">
        <strong>All caught up</strong>
        <p>No notifications yet.</p>
      </div>
    </div>

    <ng-template #loadingState>
      <div class="empty-state empty-state--loading">
        <strong>Loading notifications…</strong>
      </div>
    </ng-template>
  </section>
</div>
