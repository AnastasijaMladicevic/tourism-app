@if (isVisible) {
  <nav class="sidebar">
    <div class="sidebar__logo">
      <app-logo size="sm"></app-logo>
    </div>

    @for (item of navItems; track item.route) {
      <button
        class="sidebar__item"
        [class.sidebar__item--active]="isActive(item.route)"
        (click)="goTo(item.route)"
      >
        <span class="sidebar__item-main">
          <span class="nav-icon-wrap">
            <mat-icon>{{ item.icon }}</mat-icon>
          </span>
          <span>{{ item.labelKey | translate }}</span>
        </span>

        @if (item.route === '/notifications' && notificationsUnreadCount > 0) {
          <span class="sidebar__count-pill">{{ notificationsUnreadCount > 99 ? '99+' : notificationsUnreadCount }}</span>
        }
      </button>
    }
  </nav>

  <nav class="bottom-nav">
    @for (item of mobilePrimaryNavItems; track item.route) {
      <button
        class="bottom-nav__item"
        [class.bottom-nav__item--active]="isActive(item.route)"
        (click)="goTo(item.route)"
      >
        <span class="nav-icon-wrap">
          <mat-icon>{{ item.icon }}</mat-icon>
          @if (item.route === '/notifications' && notificationsUnreadCount > 0) {
            <span class="nav-badge">{{ notificationsUnreadCount > 9 ? '9+' : notificationsUnreadCount }}</span>
          }
        </span>
        <span>{{ item.labelKey | translate }}</span>
      </button>
    }

    <div class="bottom-nav__more">
      @if (moreMenuOpen) {
        <div class="bottom-nav__more-menu">
          @for (item of mobileMoreNavItems; track item.route) {
            <button
              type="button"
              class="bottom-nav__more-action"
              [class.bottom-nav__more-action--active]="isActive(item.route)"
              (click)="goTo(item.route)"
            >
              <mat-icon>{{ item.icon }}</mat-icon>
              <span>{{ item.labelKey | translate }}</span>
            </button>
          }
        </div>
      }

      <button
        type="button"
        class="bottom-nav__item"
        [class.bottom-nav__item--active]="isMoreMenuActive() || moreMenuOpen"
        (click)="toggleMoreMenu()"
      >
        <span class="nav-icon-wrap">
          <mat-icon>menu</mat-icon>
        </span>
        <span>{{ 'nav.more' | translate }}</span>
      </button>
    </div>
  </nav>
}
