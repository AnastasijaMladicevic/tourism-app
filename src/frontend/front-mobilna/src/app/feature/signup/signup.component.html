<div class="page">
  <app-header [backLink]="null" />

  <div class="content">
    <app-logo />

    <div class="title-section">
      <h1>Create account</h1>
      <p>Join and explore Montenegro</p>
    </div>

    <div class="form">

      <!-- Full Name -->
      <div class="field">
        <div class="input-wrapper">
          <span class="input-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
              <circle cx="12" cy="7" r="4"/>
            </svg>
          </span>
          <input type="text" placeholder="Full name" />
        </div>
      </div>

      <!-- Email -->
      <div class="field">
        <div class="input-wrapper">
          <span class="input-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
              <polyline points="22,6 12,13 2,6"/>
            </svg>
          </span>
          <input type="email" placeholder="Email" />
        </div>
      </div>

      <!-- Password -->
      <div class="field">
        <div class="input-wrapper">
          <span class="input-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
          </span>
          <input type="password" placeholder="Password" />
        </div>
      </div>

      <!-- Confirm Password -->
      <div class="field">
        <div class="input-wrapper">
          <span class="input-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
          </span>
          <input type="password" placeholder="Confirm password" />
        </div>
      </div>

      <!-- Sign Up Button -->
      <button class="btn-primary" type="button">Sign Up</button>
    </div>

    <div class="login-link">
      <span>Already have an account?</span>
      <a routerLink="/login">Log In</a>
    </div>

    <p class="terms">
      By signing in, you agree to the<br>
      <a routerLink="/terms">Terms of Service</a> and <a routerLink="/terms">Privacy Policy.</a>
    </p>
  </div>
</div>
