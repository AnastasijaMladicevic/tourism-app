<div class="page">
  <app-header />

  <div class="content">
    <h1 class="title">New Credentials</h1>

    <div class="rules">
      <div class="rule">
        <div class="rule-icon">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2.5"
               stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"/>
          </svg>
        </div>
        <span>Password must be at least 8 characters long.</span>
      </div>

      <div class="rule">
        <div class="rule-icon">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2.5"
               stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"/>
          </svg>
        </div>
        <span>Password must contain at least one upper case.</span>
      </div>

      <div class="rule">
        <div class="rule-icon">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2.5"
               stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"/>
          </svg>
        </div>
        <span>Password must contain at least one number or special character.</span>
      </div>
    </div>

    <div class="field-group">
      <label class="field-label" for="new-password">New Password</label>
      <div class="input-wrapper">
        <input id="new-password" type="password" placeholder="*****" autocomplete="new-password" />
      </div>
    </div>

    <div class="field-group">
      <label class="field-label" for="confirm-password">Confirm Password</label>
      <div class="input-wrapper">
        <input id="confirm-password" type="password" placeholder="*****" autocomplete="new-password" />
      </div>
    </div>

    <button class="btn-submit" type="button">Submit</button>
    <button class="btn-cancel" type="button" (click)="cancel()">Cancel</button>
  </div>
</div>
