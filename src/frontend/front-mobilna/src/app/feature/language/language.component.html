<div class="language-page">
  <header class="language-topbar">
    <button
      class="back-btn"
      type="button"
      (click)="goBack()"
      [attr.aria-label]="'common.back' | translate"
    >
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="m15 18-6-6 6-6" />
      </svg>
    </button>
    <h1>{{ 'region.title' | translate }}</h1>
    <div class="topbar-spacer" aria-hidden="true"></div>
  </header>

  <div class="language-shell">
    <section class="language-section">
      <h2>{{ 'region.available' | translate }}</h2>

      <div class="language-card"></div>
    </section>

    <section class="language-note">
      <div class="language-note__icon">i</div>
      <div class="language-note__content">
        <strong>{{ 'region.infoTitle' | translate }}</strong>
        <p>{{ 'region.infoBody' | translate }}</p>
      </div>
    </section>

    @if (feedback()) {
      <p class="language-feedback">{{ feedback() }}</p>
    }
  </div>

  <footer class="language-footer">
    <button class="apply-btn" type="button" [disabled]="!canApply()" (click)="applyLanguage()">
      {{ isSaving() ? ('language.saving' | translate) : ('region.apply' | translate) }}
    </button>
    <p>{{ 'region.confirm' | translate: { language: getSelectedLanguageLabel() } }}</p>
  </footer>
</div>
