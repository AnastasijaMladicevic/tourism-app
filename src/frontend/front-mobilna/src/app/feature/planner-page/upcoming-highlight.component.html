<section class="sidebar-card">
  <header class="sidebar-card__header">
    <span class="sidebar-card__icon" aria-hidden="true">
      <svg viewBox="0 0 24 24">
        <path d="M12 2 9.5 9H2l6 4.5L5.5 22 12 17.5 18.5 22 16 13.5 22 9h-7.5L12 2Z" />
      </svg>
    </span>
    <h2>Upcoming Highlight</h2>
  </header>

  @if (highlights.length) {
    <div class="highlight-list">
      @for (highlight of highlights; track highlight.id) {
        <button type="button" class="highlight-card" (click)="openDetails(highlight.eventId)">
          <img [src]="highlight.imageUrl" [alt]="highlight.title" />
          <div class="highlight-card__copy">
            <h3>{{ highlight.title }}</h3>
            <p>{{ highlight.subtitle }}</p>
          </div>
        </button>
      }
    </div>
  } @else {
    <p class="highlight-empty">No upcoming events yet.</p>
  }
</section>
