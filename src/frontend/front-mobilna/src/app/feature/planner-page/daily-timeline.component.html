<section class="sidebar-card">
  <header class="sidebar-card__header">
    <span class="sidebar-card__icon" aria-hidden="true">
      <svg viewBox="0 0 24 24">
        <path
          d="M7 2h2v2h6V2h2v2h3a2 2 0 0 1 2 2v13a3 3 0 0 1-3 3H5a3 3 0 0 1-3-3V6a2 2 0 0 1 2-2h3V2Zm13 8H4v9a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-9ZM5 6a1 1 0 0 0-1 1v1h16V7a1 1 0 0 0-1-1H5Z"
        />
      </svg>
    </span>
    <h2>Daily Timeline</h2>
  </header>

  @if (days.length) {
    <div class="timeline-grid">
      @for (day of days; track day.id) {
        <button
          type="button"
          class="timeline-day"
          [class.timeline-day--active]="day.active"
          (click)="selectDay(day.id)"
        >
          <span>{{ day.label }}</span>
          <strong>{{ day.date }}</strong>
          <small>{{ day.month }}</small>
        </button>
      }
    </div>
  } @else {
    <p class="timeline-empty">No days in your plan yet.</p>
  }
</section>
