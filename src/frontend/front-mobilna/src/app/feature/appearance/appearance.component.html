<div class="appearance-page">
  <div class="appearance-shell">
    <header class="topbar">
      <button class="back-btn" type="button" (click)="goBack()">
        <mat-icon>arrow_back_ios_new</mat-icon>
      </button>

      <h1>{{ 'appearance.title' | translate }}</h1>

      <div class="topbar-spacer"></div>
    </header>

    <section class="appearance-card">
      <div class="appearance-copy">
        <span class="appearance-kicker">{{ 'appearance.kicker' | translate }}</span>
        <h2>{{ 'appearance.heading' | translate }}</h2>
        <p>{{ 'appearance.body' | translate }}</p>
      </div>

      <div class="theme-grid">
        @for (option of options; track option.value) {
          <button
            type="button"
            class="theme-option"
            [class.theme-option--active]="isSelected(option.value)"
            (click)="setTheme(option.value)"
          >
            <div class="theme-option__header">
              <span class="theme-option__icon">
                <mat-icon>{{ option.icon }}</mat-icon>
              </span>

              @if (isSelected(option.value)) {
                <mat-icon class="theme-option__check">check_circle</mat-icon>
              }
            </div>

            <strong>{{ option.titleKey | translate }}</strong>
            <p>{{ option.bodyKey | translate }}</p>

            <div class="theme-preview" [attr.data-preview]="option.value">
              <span class="theme-preview__bar"></span>
              <div class="theme-preview__hero"></div>
              <div class="theme-preview__row">
                <span></span>
                <span></span>
                <span></span>
              </div>
            </div>
          </button>
        }
      </div>

      <p class="appearance-hint">{{ 'appearance.appliesImmediately' | translate }}</p>
    </section>
  </div>
</div>
