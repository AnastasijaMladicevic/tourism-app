<div class="page">
  <div class="card">
    <div class="auth-topbar">
      <!-- Back button -->
      <button class="back-btn" (click)="goBack()" [attr.aria-label]="'common.back' | translate">
        <span class="material-icons">arrow_back_ios</span>
      </button>

      <!-- Logo -->
      <div class="logo">
        <app-logo size="lg"></app-logo>
      </div>

      <span class="auth-topbar__spacer" aria-hidden="true"></span>
    </div>

    <!-- Content -->
    <div class="content">
      <h1 class="title">{{ 'auth.passwordUpdated.title' | translate }}</h1>
      <p class="subtitle">{{ 'auth.passwordUpdated.body' | translate }}</p>
    </div>

    <!-- Login button -->
    <button class="btn btn-primary" (click)="goToLogin()" (keydown.enter)="goToLogin()">
      {{ 'auth.passwordUpdated.loginButton' | translate }}
    </button>
  </div>
</div>
