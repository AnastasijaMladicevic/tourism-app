<div class="page">
  <div class="card">
    <div class="auth-topbar">
      <!-- Back button -->
      <button class="back-btn" (click)="goBack()" aria-label="Go back">
        <span class="material-icons">arrow_back_ios</span>
      </button>

      <!-- Logo -->
      <div class="logo">
        <app-logo size="lg"></app-logo>
      </div>

      <span class="auth-topbar__spacer" aria-hidden="true"></span>
    </div>

    <!-- Content -->
    <div class="content">
      <h1 class="title">Password Updated</h1>
      <p class="subtitle">Your password has been successfully updated.</p>
    </div>

    <!-- Login button -->
    <button class="btn btn-primary" (click)="goToLogin()" (keydown.enter)="goToLogin()">
      Login
    </button>
  </div>
</div>
