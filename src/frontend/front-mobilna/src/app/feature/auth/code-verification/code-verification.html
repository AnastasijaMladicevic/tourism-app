<div class="page">
  <div class="card">
    <!-- Back button -->
    <button class="back-btn" (click)="goBack()" aria-label="Go back">
      <span class="material-icons">arrow_back_ios</span>
    </button>

    <!-- Logo -->
    <div class="logo">
      <app-logo size="lg"></app-logo>
    </div>

    <!-- Heading -->
    <h1 class="title">Code Verification</h1>
    <p class="subtitle">
      Enter OTP (One time password) sent to<br />
      <span class="email">{{ email }}</span>
    </p>

    <!-- OTP inputs -->
    <div class="otp-row" (paste)="onPaste($event)">
      @for (val of otpValues; track $index) {
        <input
          #otpInput
          class="otp-input"
          [class.otp-input--filled]="otpValues[$index] !== ''"
          [class.otp-input--error]="errorMessage !== ''"
          type="text"
          inputmode="numeric"
          maxlength="1"
          autocomplete="one-time-code"
          [value]="otpValues[$index]"
          (input)="onInput($event, $index)"
          (keydown)="onKeyDown($event, $index)"
          [attr.aria-label]="'OTP digit ' + ($index + 1)"
        />
      }
    </div>

    <!-- Timer -->
    <p class="timer" [class.timer--expired]="isExpired">{{ timerDisplay }}</p>

    <!-- Error -->
    @if (errorMessage) {
      <p class="error" role="alert">{{ errorMessage }}</p>
    }

    <!-- Buttons -->
    <button
      class="btn btn-primary"
      [class.btn-loading]="isLoading"
      [disabled]="isLoading || !isOtpComplete || isExpired"
      (click)="verifyCode()"
    >
      @if (isLoading) {
        <span class="spinner"></span>
      } @else {
        Verify Code
      }
    </button>

    <button class="btn btn-outline" [disabled]="isLoading" (click)="resendCode()">
      Resend Code
    </button>
  </div>
</div>
