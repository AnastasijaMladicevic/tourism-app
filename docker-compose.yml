services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./src/backend/TuristickiVodic
      dockerfile: TuristickiVodic.API/Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      Jwt__Key: ${JWT_KEY}
      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}
      PublicApp__BaseUrl: ${PUBLIC_APP_BASE_URL}
      Cors__AllowedOrigins__0: ${PUBLIC_APP_BASE_URL}
      ReverseProxy__UseHttpsRedirection: ${REVERSE_PROXY_USE_HTTPS_REDIRECTION}
      SeedData__RunOnStartup: true
      SeedData__FilePath: /seed/seed.sql
      Smtp__Host: ${SMTP_HOST}
      Smtp__Port: ${SMTP_PORT}
      Smtp__Username: ${SMTP_USERNAME}
      Smtp__Password: ${SMTP_PASSWORD}
      Smtp__FromEmail: ${SMTP_FROM_EMAIL}
      Smtp__FromName: ${SMTP_FROM_NAME}
      Smtp__EnableSsl: ${SMTP_ENABLE_SSL}
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8080"
    volumes:
      - api-images:/app/wwwroot/images
      - ./src/baza:/seed:ro

  tourist-front:
    build:
      context: ./src/frontend/front-mobilna
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    ports:
      - "${FRONTEND_PORT}:80"

volumes:
  postgres-data:
  api-images:
